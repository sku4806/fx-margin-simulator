<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 환율 마진 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 환율 헤더 카드 -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">영업 마진 & 환율 시뮬레이터</h1>
        <p class="text-sm text-slate-500">실시간 환율 기반 단가 직접 입력 및 세일 한도 마진 분석</p>
      </div>
      <div class="text-left md:text-right">
        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">실시간 USD/KRW</span>
        <div id="liveFx" class="text-2xl font-black text-slate-900 mt-1">로딩 중...</div>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 직접 입력 및 조건 설정 영역 -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-1 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-base text-slate-900">단가 직접 입력</h2>
          <span class="text-[11px] text-slate-400">수기 입력 모드</span>
        </div>

        <div class="space-y-3 text-xs font-medium">
          <div>
            <label class="text-slate-600 block mb-1">선적 매입 단가 (USD, $)</label>
            <input type="number" id="inputUsd" value="50.0" step="0.1" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="text-slate-600 block mb-1">선적 당시 환율 (KRW)</label>
            <input type="number" id="inputShipFx" value="1350" step="1" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="text-slate-600 block mb-1">정상 판매가 (MSRP, KRW)</label>
            <input type="number" id="inputMsrp" value="100000" step="1000" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="text-slate-600 block mb-1">목표 하한 마진율 (%)</label>
            <input type="number" id="inputTargetMargin" value="20" min="1" max="90" step="1" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="pt-3 border-t">
          <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
            <span>세일 할인율(%)</span>
            <span id="discountVal" class="text-indigo-600 font-bold">0%</span>
          </div>
          <input type="range" id="discountSlider" min="0" max="50" step="1" value="0" class="w-full accent-indigo-600 cursor-pointer">
        </div>

        <div class="pt-3 border-t space-y-2 text-xs text-slate-500">
          <div class="flex justify-between items-center">
            <span>선적 매입원가:</span>
            <div class="text-right">
              <span id="shipCostKrw" class="font-bold text-slate-700">-</span>
              <span id="shipCostUsd" class="block text-[11px] text-slate-400 font-medium">($0.00)</span>
            </div>
          </div>
          <div class="flex justify-between items-center">
            <span>현재 대체원가:</span>
            <div class="text-right">
              <span id="replaceCostKrw" class="font-bold text-slate-700">-</span>
              <span id="replaceCostUsd" class="block text-[11px] text-slate-400 font-medium">($0.00)</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 판정 리포트 대시보드 -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-2 space-y-5">
        <h2 class="font-bold text-base text-slate-900 border-b pb-2">마진 판정 리포트</h2>

        <!-- 판정 알림 박스 -->
        <div id="alertBox" class="p-4 rounded-xl border flex items-center gap-3 bg-green-50 border-green-200 text-green-800">
          <div class="text-xl">✅</div>
          <div class="text-sm font-semibold" id="alertMsg">목표 마진을 안정적으로 확보 중입니다.</div>
        </div>

        <!-- 가격 & 마진 표시 카드 -->
        <div class="grid grid-cols-2 gap-4">
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <span class="text-xs text-slate-500 font-medium">최종 세일 판매가</span>
            <div id="salePriceKrw" class="text-2xl font-extrabold text-slate-900 mt-1">₩0</div>
            <div id="salePriceUsd" class="text-sm font-semibold text-indigo-600 mt-0.5">($0.00)</div>
          </div>
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <span class="text-xs text-slate-500 font-medium">확보 마진율 (선적 기준)</span>
            <div id="actualMargin" class="text-2xl font-extrabold text-slate-900 mt-1">0%</div>
            <div id="replacementMarginText" class="text-xs text-slate-400 mt-1">차기 원가 기준 마진: 0%</div>
          </div>
        </div>

        <!-- 가이드라인 -->
        <div class="p-4 rounded-xl bg-indigo-50/70 border border-indigo-100 space-y-2.5 text-sm">
          <div class="font-bold text-indigo-950">💡 마진 방어 가이드라인</div>
          <div class="flex justify-between text-xs text-indigo-900">
            <span>목표 마진 확보를 위한 최대 허용 할인:</span>
            <span id="maxDiscountShip" class="font-bold text-indigo-600">0%</span>
          </div>
          <div class="flex justify-between text-xs text-indigo-900">
            <span>재발주 대체원가 방어 최대 허용 할인:</span>
            <span id="maxDiscountReplace" class="font-bold text-indigo-600">0%</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentDiscount = 0;
    let currentFxRate = 1380.0;

    async function init() {
      try {
        const fxRes = await fetch('/api/fx-rate');
        const fxData = await fxRes.json();
        currentFxRate = fxData.current_rate;
        document.getElementById('liveFx').innerText = `${Math.round(currentFxRate).toLocaleString()} 원`;
      } catch (err) {
        console.warn("실시간 환율 로드 실패, 기본값 사용", err);
      }

      // 이벤트 리스너 바인딩 (입력값이 바뀔 때마다 실시간 재계산)
      ['inputUsd', 'inputShipFx', 'inputMsrp', 'inputTargetMargin'].forEach(id => {
        document.getElementById(id).addEventListener('input', runSimulation);
      });

      document.getElementById('discountSlider').addEventListener('input', (e) => {
        currentDiscount = e.target.value / 100;
        document.getElementById('discountVal').innerText = `${e.target.value}%`;
        runSimulation();
      });

      runSimulation();
    }

    function runSimulation() {
      // 1. 사용자 직접 입력값 수집
      const usd = parseFloat(document.getElementById('inputUsd').value) || 0;
      const shipFx = parseFloat(document.getElementById('inputShipFx').value) || 0;
      const msrp = parseFloat(document.getElementById('inputMsrp').value) || 0;
      const targetMargin = (parseFloat(document.getElementById('inputTargetMargin').value) || 0) / 100;

      // 2. 원가 및 판매가 계산
      const actualCostKrw = usd * shipFx;
      const replacementCostKrw = usd * currentFxRate;
      const salePrice = msrp * (1 - currentDiscount);

      // 3. 마진율 계산
      const actualMarginKrw = salePrice - actualCostKrw;
      const actualMarginRate = salePrice > 0 ? (actualMarginKrw / salePrice) : 0;

      const replacementMarginKrw = salePrice - replacementCostKrw;
      const replacementMarginRate = salePrice > 0 ? (replacementMarginKrw / salePrice) : 0;

      // 4. 방어 한계 할인율 계산
      const minSafePriceActual = targetMargin < 1 ? (actualCostKrw / (1 - targetMargin)) : msrp;
      const maxDiscountActual = msrp > 0 ? Math.max(0, (msrp - minSafePriceActual) / msrp) : 0;

      const minSafePriceReplacement = targetMargin < 1 ? (replacementCostKrw / (1 - targetMargin)) : msrp;
      const maxDiscountReplacement = msrp > 0 ? Math.max(0, (msrp - minSafePriceReplacement) / msrp) : 0;

      // 5. 달러 환산
      const shipCostUsd = usd.toFixed(2);
      const replaceCostUsd = (replacementCostKrw / currentFxRate).toFixed(2);
      const salePriceUsd = (salePrice / currentFxRate).toFixed(2);

      // 6. UI 반영
      document.getElementById('shipCostKrw').innerText = `₩${Math.round(actualCostKrw).toLocaleString()}`;
      document.getElementById('shipCostUsd').innerText = `($${shipCostUsd})`;

      document.getElementById('replaceCostKrw').innerText = `₩${Math.round(replacementCostKrw).toLocaleString()}`;
      document.getElementById('replaceCostUsd').innerText = `($${replaceCostUsd})`;

      document.getElementById('salePriceKrw').innerText = `₩${Math.round(salePrice).toLocaleString()}`;
      document.getElementById('salePriceUsd').innerText = `($${salePriceUsd})`;

      const marginEl = document.getElementById('actualMargin');
      marginEl.innerText = `${(actualMarginRate * 100).toFixed(2)}%`;
      document.getElementById('replacementMarginText').innerText = `차기 원가 기준 마진: ${(replacementMarginRate * 100).toFixed(2)}%`;

      document.getElementById('maxDiscountShip').innerText = `${(maxDiscountActual * 100).toFixed(2)}%`;
      document.getElementById('maxDiscountReplace').innerText = `${(maxDiscountReplacement * 100).toFixed(2)}%`;

      // 7. 경고 알림 판정
      const alertBox = document.getElementById('alertBox');
      const alertMsg = document.getElementById('alertMsg');

      if (salePrice < replacementCostKrw) {
        alertBox.className = "p-4 rounded-xl border flex items-center gap-3 bg-red-100 border-red-300 text-red-900";
        alertMsg.innerText = "🚨 경고: 현재 환율 급등으로 판매가가 차기 재구매 원가보다 낮습니다. (역마진)";
        marginEl.className = "text-2xl font-extrabold text-red-600 mt-1";
      } else if (actualMarginRate < targetMargin) {
        alertBox.className = "p-4 rounded-xl border flex items-center gap-3 bg-amber-50 border-amber-300 text-amber-900";
        alertMsg.innerText = `⚠️ 주의: 목표 마진율(${(targetMargin * 100).toFixed(0)}%) 하한선을 밑돌고 있습니다.`;
        marginEl.className = "text-2xl font-extrabold text-amber-600 mt-1";
      } else {
        alertBox.className = "p-4 rounded-xl border flex items-center gap-3 bg-green-50 border-green-200 text-green-800";
        alertMsg.innerText = "✅ 목표 마진을 안정적으로 확보 중입니다.";
        marginEl.className = "text-2xl font-extrabold text-slate-900 mt-1";
      }
    }

    window.onload = init;
  </script>
</body>
</html>
